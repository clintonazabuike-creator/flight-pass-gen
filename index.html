<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Flight Itinerary Generator</title>
    <style>
        body { background: #12002b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; margin: 0; }
        
        /* Control Dashboard */
        .controls { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 25px; width: 100%; max-width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box;}
        .controls h2 { grid-column: 1/-1; margin: 0 0 5px 0; font-size: 16px; color: #12002b; text-transform: uppercase; letter-spacing: 0.5px; }
        .group { display: flex; flex-direction: column; }
        label { font-size: 10px; font-weight: bold; color: #777; margin-bottom: 4px; text-transform: uppercase; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
        .full-width { grid-column: 1/-1; }
        .print-btn { grid-column: 1/-1; background: #ff0055; color: white; border: none; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 6px; margin-top: 5px; font-size: 14px; }

        /* THE MOBILE CARD */
        .phone-canvas { width: 390px; background: transparent; padding: 10px; box-sizing: border-box; }
        .card { background: #ffffff; border-radius: 24px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.4); padding: 20px; box-sizing: border-box; position: relative; }
        
        /* Top Header */
        .card-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eef0f5; padding-bottom: 16px; margin-bottom: 20px; }
        .airline-meta { display: flex; align-items: center; gap: 12px; }
        .logo-slot { width: 32px; height: 16px; display: flex; align-items: center; justify-content: center; }
        .logo-slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .fallback-logo { width: 24px; height: 8px; background: #e61c24; border-radius: 2px; transform: skewX(-20deg); }
        .header-title-wrap { display: flex; flex-direction: column; }
        .header-main-title { font-size: 18px; font-weight: 700; color: #000; }
        .header-sub-title { font-size: 14px; color: #8e8e93; margin-top: 2px; }
        .chevron { font-size: 18px; color: #000; font-weight: bold; }

        /* Flight Segment Info */
        .flight-identity { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 15px; font-weight: 600; color: #000; }

        /* Timeline Graphics */
        .timeline-container { display: flex; position: relative; margin-bottom: 20px; padding-left: 5px; }
        .axis-bar { width: 2px; position: absolute; top: 12px; bottom: 12px; left: 5px; background: #d1d1d6; display: flex; align-items: center; justify-content: center; }
        .axis-plane { background: #fff; padding: 4px 0; color: #8e8e93; font-size: 16px; transform: rotate(90deg); margin-left: -1px; }
        
        .nodes-wrapper { display: flex; flex-direction: column; gap: 45px; width: 100%; padding-left: 25px; }
        .time-node { position: relative; }
        .time-node::before { content: ''; position: absolute; width: 8px; height: 8px; background: #fff; border: 2px solid #8e8e93; border-radius: 50%; left: -25px; top: 6px; }
        
        .node-time { font-size: 17px; font-weight: 800; color: #000; margin-bottom: 2px; }
        .node-location { font-size: 15px; color: #000; font-weight: 400; line-height: 1.3; }
        .node-date { font-size: 13px; color: #8e8e93; margin-top: 2px; }

        /* Footer Utilities/Amenities Bar */
        .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 25px; padding-top: 15px; border-top: 1px solid #eef0f5; }
        .class-pill { background: #f2f2f7; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; color: #431b75; display: flex; align-items: center; gap: 6px; }
        .class-pill::after { content: '∨'; font-size: 10px; font-weight: bold; margin-left: 2px; color: #431b75; }
        .amenities { display: flex; gap: 16px; color: #431b75; font-size: 18px; }
        .amenity-icon { opacity: 0.3; display: none; }
        .amenity-icon.active { display: block; opacity: 1; }

        @media print {
            .controls { display: none; }
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: 1px solid #eef0f5; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>Itinerary Interface Engine</h2>
        <div class="group full-width"><label>Airline Brand</label><input type="text" id="in-airline" placeholder="British Airways" value="British Airways" oninput="upd()"></div>
        <div class="group full-width"><label>Airline Logo URL (PNG)</label><input type="text" id="in-logo" placeholder="Paste image link..." oninput="upd()"></div>
        
        <div class="group"><label>Departure Time</label><input type="text" id="in-dep-time" value="6:40a" oninput="upd()"></div>
        <div class="group"><label>Arrival Time</label><input type="text" id="in-arr-time" value="7:45a" oninput="upd()"></div>
        
        <div class="group full-width"><label>Departure Airport/City</label><input type="text" id="in-dep-city" value="Berlín-Brandenburgo Willy Brandt (BER)" oninput="upd()"></div>
        <div class="group full-width"><label>Arrival Airport/City</label><input type="text" id="in-arr-city" value="Londres-Heathrow (LHR)" oninput="upd()"></div>
        
        <div class="group"><label>Date Summary</label><input type="text" id="in-date-sum" value="May 10" oninput="upd()"></div>
        <div class="group"><label>Full Date Style</label><input type="text" id="in-date-full" value="Sun, May 10" oninput="upd()"></div>
        
        <div class="group"><label>Flight Number</label><input type="text" id="in-flight" value="999" oninput="upd()"></div>
        <div class="group"><label>Duration</label><input type="text" id="in-duration" value="2h 5m" oninput="upd()"></div>
        
        <div class="group"><label>Cabin Tier</label><input type="text" id="in-cabin" value="Turista" oninput="upd()"></div>
        <div class="group"><label>Amenities</label>
            <select id="in-amenity-preset" onchange="upd()">
                <option value="all">All Included</option>
                <option value="basic">Wi-Fi Only</option>
                <option value="none">No Services</option>
            </select>
        </div>
        
        <button class="print-btn" onclick="window.print()">SAVE SCREENSHOT / PDF</button>
    </div>

    <div class="phone-canvas">
        <div class="card">
            <div class="card-header">
                <div class="airline-meta">
                    <div class="logo-slot" id="o-logo-container">
                        <div class="fallback-logo"></div>
                    </div>
                    <div class="header-title-wrap">
                        <span class="header-main-title">Departure – <span id="o-date-sum">May 10</span></span>
                        <span class="header-sub-title"><span id="o-airline-hd">British Airways</span> • <span id="o-duration-hd">2h 5m</span></span>
                    </div>
                </div>
                <div class="chevron">∧</div>
            </div>

            <div class="flight-identity">
                <div class="logo-slot" id="o-logo-sub-container" style="width:24px;"><div class="fallback-logo" style="transform: scale(0.7) skewX(-20deg);"></div></div>
                <span><span id="o-airline-mid">British Airways</span> <span id="o-flight-no">999</span></span>
            </div>

            <div class="timeline-container">
                <div class="axis-bar">
                    <div class="axis-plane">✈</div>
                </div>
                <div class="nodes-wrapper">
                    <div class="time-node">
                        <div class="node-time" id="o-dep-time">6:40a</div>
                        <div class="node-location" id="o-dep-city">Berlín-Brandenburgo Willy Brandt (BER)</div>
                        <div class="node-date" id="o-date-f1">Sun, May 10</div>
                    </div>
                    <div class="time-node">
                        <div class="node-time" id="o-arr-time">7:45a</div>
                        <div class="node-location" id="o-arr-city">Londres-Heathrow (LHR)</div>
                        <div class="node-date" id="o-date-f2">Sun, May 10</div>
                    </div>
                </div>
            </div>

            <div class="card-footer">
                <div class="class-pill" id="o-cabin">Turista</div>
                <div class="amenities">
                    <span class="amenity-icon active" id="am-wifi">📶</span>
                    <span class="amenity-icon active" id="am-power">🔌</span>
                    <span class="amenity-icon active" id="am-seat">💺</span>
                    <span class="amenity-icon active" id="am-food">🍴</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function upd() {
            const get = (id) => document.getElementById(id).value;
            
            // Text values replacement
            document.getElementById('o-date-sum').innerText = get('in-date-sum');
            document.getElementById('o-airline-hd').innerText = get('in-airline');
            document.getElementById('o-airline-mid').innerText = get('in-airline');
            document.getElementById('o-duration-hd').innerText = get('in-duration');
            document.getElementById('o-flight-no').innerText = get('in-flight');
            document.getElementById('o-dep-time').innerText = get('in-dep-time');
            document.getElementById('o-arr-time').innerText = get('in-arr-time');
            document.getElementById('o-dep-city').innerText = get('in-dep-city');
            document.getElementById('o-arr-city').innerText = get('in-arr-city');
            document.getElementById('o-date-f1').innerText = get('in-date-full');
            document.getElementById('o-date-f2').innerText = get('in-date-full');
            document.getElementById('o-cabin').innerText = get('in-cabin');

            // Handle Logo URL fields if provided
            const logoUrl = get('in-logo');
            if(logoUrl) {
                document.getElementById('o-logo-container').innerHTML = `<img src="${logoUrl}">`;
                document.getElementById('o-logo-sub-container').innerHTML = `<img src="${logoUrl}">`;
            } else {
                document.getElementById('o-logo-container').innerHTML = `<div class="fallback-logo"></div>`;
                document.getElementById('o-logo-sub-container').innerHTML = `<div class="fallback-logo" style="transform: scale(0.7) skewX(-20deg);"></div>`;
            }

            // Amenities configuration settings
            const amPreset = get('in-amenity-preset');
            const icons = ['am-wifi', 'am-power', 'am-seat', 'am-food'];
            
            icons.forEach(id => document.getElementById(id).classList.remove('active'));
            
            if (amPreset === 'all') {
                icons.forEach(id => document.getElementById(id).classList.add('active'));
            } else if (amPreset === 'basic') {
                document.getElementById('am-wifi').classList.add('active');
            }
        }
        // Initialize fields default values layout configuration settings array logic.
        upd();
    </script>
</body>
</html>
